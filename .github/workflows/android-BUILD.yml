name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*' # Triggers on semantic version tags like v1.0.0
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (optional, e.g. v1.0.0-35mos)'
        required: false
        default: ''

permissions:
  contents: write # Required for creating releases and uploading assets

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Make Gradle Executable
      run: chmod +x ./gradlew

    - name: Determine Release Version
      id: get_version
      run: |
        set -euo pipefail
        if [ -n "${{ github.event.inputs.version }}" ]; then
          TAG="${{ github.event.inputs.version }}"
        elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
          TAG="${{ github.ref_name }}"
        else
          APP_VER=$(grep -m 1 'versionName' app/build.gradle | sed -E 's/.*versionName "([^"]+)".*/\1/')
          TAG="v${APP_VER}"
        fi

        if [[ ! "$TAG" =~ ^v ]]; then
          TAG="v${TAG}"
        fi
        CLEAN_VER="${TAG#v}"

        echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
        echo "RELEASE_VERSION=$CLEAN_VER" >> $GITHUB_ENV
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "version=$CLEAN_VER" >> $GITHUB_OUTPUT
        echo "Building release for version: $TAG (clean: $CLEAN_VER)"

    - name: Prepare Keystore for Signing
      run: |
        if [ -f "$GITHUB_WORKSPACE/debug.keystore.base64" ]; then
          echo "Restoring keystore from debug.keystore.base64"
          base64 -d "$GITHUB_WORKSPACE/debug.keystore.base64" > "$GITHUB_WORKSPACE/debug.keystore"
        elif [ ! -f "$GITHUB_WORKSPACE/debug.keystore" ]; then
          echo "Generating fallback keystore"
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
        else
          echo "Using existing debug.keystore"
        fi
    - name: Download Bootstrap Archives
      run: ./gradlew downloadBootstraps --no-daemon
  
    - name: Build Release APK
      run: |
        ./gradlew assembleRelease --no-daemon -Dorg.gradle.workers.max=2

    - name: Prepare and Name Release APK Assets
      run: |
        set -euo pipefail
        cd app/build/outputs/apk/release/

        # Identify generated APK
        if [ -f "app-release.apk" ]; then
          SOURCE_APK="app-release.apk"
        elif [ -f "app-release-unsigned.apk" ]; then
          SOURCE_APK="app-release-unsigned.apk"
          if command -v apksigner >/dev/null 2>&1; then
            echo "Signing unsigned APK with apksigner..."
            apksigner sign --ks "$GITHUB_WORKSPACE/debug.keystore" --ks-pass pass:android --key-pass pass:android --out app-release.apk "$SOURCE_APK"
            SOURCE_APK="app-release.apk"
          elif command -v jarsigner >/dev/null 2>&1; then
            echo "Signing unsigned APK with jarsigner..."
            jarsigner -keystore "$GITHUB_WORKSPACE/debug.keystore" -storepass android -keypass android "$SOURCE_APK" androiddebugkey
          fi
        else
          shopt -s nullglob
          APK_FILES=( *.apk )
          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "Error: No APK found in app/build/outputs/apk/release/!" >&2
            exit 1
          fi
          SOURCE_APK="${APK_FILES[0]}"
        fi

        echo "Primary Release APK identified: $SOURCE_APK"
        VERSION="${RELEASE_TAG}"

        cp "$SOURCE_APK" Konsole-OS.apk
        cp "$SOURCE_APK" "universal-${VERSION}-release.apk"

        for abi in arm64-v8a armeabi-v7a x86 x86_64; do
          cp "$SOURCE_APK" "${abi}-${VERSION}-release.apk"
        done

        echo "Created Konsole-OS.apk, universal-${VERSION}-release.apk, and per-ABI named copies."

    - name: Extract Release Notes and Generate Checksums
      id: release_notes
      run: |
        set -euo pipefail
        cd app/build/outputs/apk/release/

        calc_size() {
          local file=$1
          ls -lh "$file" | awk '{print $5}'
        }

        calc_sha() {
          local file=$1
          sha256sum "$file" | awk '{print $1}'
        }

        VERSION="${RELEASE_TAG}"
        UNIVERSAL_NAME="universal-${VERSION}-release.apk"
        ARM64_NAME="arm64-v8a-${VERSION}-release.apk"
        ARMV7_NAME="armeabi-v7a-${VERSION}-release.apk"
        X86_NAME="x86-${VERSION}-release.apk"
        X86_64_NAME="x86_64-${VERSION}-release.apk"

        cat << EOF > "$GITHUB_WORKSPACE/body.md"
        ### 🚀 Automated Build Details

        * **Release Tag:** \`${VERSION}\`
        * **Commit Reference:** \`${{ github.sha }}\`
        * **Triggered By:** @${{ github.actor }}
        * **Build Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
        * **Pipeline Source:** [Job Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

        ---

        ### 📦 APK Assets

        ABI splits are disabled for this build. The architecture-named assets below are copies of the same universal APK, not separately optimized builds.

        | Asset | Build Size | SHA-256 |
        | :--- | :--- | :--- |
        | \`${UNIVERSAL_NAME}\` (universal) | \`$(calc_size "$UNIVERSAL_NAME")\` | \`$(calc_sha "$UNIVERSAL_NAME")\` |
        | \`${ARM64_NAME}\` | \`$(calc_size "$ARM64_NAME")\` | \`$(calc_sha "$ARM64_NAME")\` |
        | \`${ARMV7_NAME}\` | \`$(calc_size "$ARMV7_NAME")\` | \`$(calc_sha "$ARMV7_NAME")\` |
        | \`${X86_NAME}\` | \`$(calc_size "$X86_NAME")\` | \`$(calc_sha "$X86_NAME")\` |
        | \`${X86_64_NAME}\` | \`$(calc_size "$X86_64_NAME")\` | \`$(calc_sha "$X86_64_NAME")\` |
        | \`Konsole-OS.apk\` | \`$(calc_size "Konsole-OS.apk")\` | \`$(calc_sha "Konsole-OS.apk")\` |

        ---

        ### 📝 Changelog

        For full update details and commit history, see [the commits for this release](${{ github.server_url }}/${{ github.repository }}/commits/${VERSION}).

        ### 📥 Installation

        Download the universal APK or an ABI-named copy above, then install it on your Android device.
        EOF

        if [ -f "$GITHUB_WORKSPACE/fix-bug.md" ]; then
          {
            echo ""
            echo "---"
            echo ""
            echo "### 🐛 Bug Fixes and New Features"
            echo ""
            cat "$GITHUB_WORKSPACE/fix-bug.md"
            echo ""
          } >> "$GITHUB_WORKSPACE/body.md"
        fi

    - name: Upload APKs as Workflow Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: konsole-os-${{ env.RELEASE_TAG }}
        path: |
          app/build/outputs/apk/release/*.apk
        retention-days: 14

    - name: Create Release and Upload APKs
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: "Release ${{ env.RELEASE_TAG }}"
        body_path: body.md
        draft: false
        prerelease: false
        fail_on_unmatched_files: false
        files: |
          app/build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Trigger Termux Library Builds on Jitpack

on:
  release:
    types:
      - published

jobs:
  trigger-termux-library-builds:
    runs-on: ubuntu-latest
    steps:
      - name: Set vars
        run: echo "TERMUX_LIB_VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"

      - name: Echo release
        run: echo "Triggering library builds on jitpack for '$TERMUX_LIB_VERSION' release after waiting for 3 mins"

      - name: Trigger library builds on jitpack
        run: |
          if [ "$TERMUX_LIB_VERSION" == "debug" ]; then
            echo "Skipping rolling debug release."
            exit 0
          fi
          sleep 180
          curl -sS --max-time 600 "https://jitpack.io/com/termux/termux-app/terminal-emulator/$TERMUX_LIB_VERSION/terminal-emulator-$TERMUX_LIB_VERSION.pom" || true
          curl -sS --max-time 600 "https://jitpack.io/com/termux/termux-app/terminal-view/$TERMUX_LIB_VERSION/terminal-view-$TERMUX_LIB_VERSION.pom" || true
          curl -sS --max-time 600 "https://jitpack.io/com/termux/termux-app/termux-shared/$TERMUX_LIB_VERSION/termux-shared-$TERMUX_LIB_VERSION.pom" || true

name: Attach Debug APKs To Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  attach-apks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_variant: [ apt-android-7, apt-android-5 ]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Executable
        run: chmod +x ./gradlew

      - name: Prepare Keystore for Signing
        run: |
          if [ -f "$GITHUB_WORKSPACE/debug.keystore.base64" ]; then
            base64 -d "$GITHUB_WORKSPACE/debug.keystore.base64" > "$GITHUB_WORKSPACE/debug.keystore"
          elif [ ! -f "$GITHUB_WORKSPACE/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build and attach universal debug APK to release
        shell: bash {0}
        env:
          PACKAGE_VARIANT: ${{ matrix.package_variant }}
        run: |
          set -euo pipefail
          RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          if [ "$RELEASE_TAG" == "debug" ]; then
            echo "Skipping rolling 'debug' tag handled by build-debug-app.yml."
            exit 0
          fi

          APK_DIR_PATH="./app/build/outputs/apk/debug"
          APK_VERSION_TAG="${RELEASE_TAG}+${PACKAGE_VARIANT}-github-debug"
          OUT_APK="konsole-os_${APK_VERSION_TAG}_universal.apk"

          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG"
          export TERMUX_PACKAGE_VARIANT="$PACKAGE_VARIANT"

          ./gradlew assembleDebug --no-daemon -Dorg.gradle.workers.max=2

          SOURCE_APK=$(ls "$APK_DIR_PATH"/*.apk 2>/dev/null | head -n 1 || true)
          if [ -z "$SOURCE_APK" ] || [ ! -f "$SOURCE_APK" ]; then
            echo "Error: Failed to find built debug APK in $APK_DIR_PATH" >&2
            exit 1
          fi

          cp "$SOURCE_APK" "$APK_DIR_PATH/$OUT_APK"
          (cd "$APK_DIR_PATH" && sha256sum "$OUT_APK" > "${OUT_APK%.apk}_sha256sums.txt")

          gh release upload "$RELEASE_TAG" \
            "$APK_DIR_PATH/$OUT_APK" \
            "$APK_DIR_PATH/${OUT_APK%.apk}_sha256sums.txt" \
            --clobber

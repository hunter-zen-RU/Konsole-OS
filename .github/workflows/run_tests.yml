name: Unit tests

on:
  push:
    branches:
      - main
      - master
      - android-10
  pull_request:
    branches:
      - main
      - master
      - android-10
  workflow_dispatch:

jobs:
  testing:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Executable
        run: chmod +x ./gradlew

      - name: Execute Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon -Dorg.gradle.workers.max=2

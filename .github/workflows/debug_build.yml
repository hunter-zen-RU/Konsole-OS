name: Build

on:
  push:
    branches:
      - main
      - master
      - 'github-releases/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_variant: [ apt-android-7, apt-android-5 ]

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Executable
        run: chmod +x ./gradlew

      - name: Prepare Keystore for Signing
        run: |
          if [ -f "$GITHUB_WORKSPACE/debug.keystore.base64" ]; then
            base64 -d "$GITHUB_WORKSPACE/debug.keystore.base64" > "$GITHUB_WORKSPACE/debug.keystore"
          elif [ ! -f "$GITHUB_WORKSPACE/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APKs
        shell: bash {0}
        env:
          PACKAGE_VARIANT: ${{ matrix.package_variant }}
        run: |
          set -euo pipefail

          SHA_VAL="${{ github.sha }}"
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            SHA_VAL="${{ github.event.pull_request.head.sha }}"
          fi

          CURRENT_VERSION_NAME=$(grep -m 1 'versionName' ./app/build.gradle | sed -E 's/.*versionName "([^"]+)".*/\1/')
          RELEASE_VERSION_NAME="v${CURRENT_VERSION_NAME}+${SHA_VAL:0:7}"
          if ! printf "%s" "${RELEASE_VERSION_NAME#v}" | grep -qP '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'; then
            echo "Invalid versionName '${RELEASE_VERSION_NAME#v}'" >&2
            exit 1
          fi

          APK_DIR_PATH="./app/build/outputs/apk/debug"
          APK_VERSION_TAG="${RELEASE_VERSION_NAME}-${PACKAGE_VARIANT}-github-debug"
          APK_BASENAME="konsole-os_${APK_VERSION_TAG}_universal.apk"

          echo "APK_DIR_PATH=$APK_DIR_PATH" >> "$GITHUB_ENV"
          echo "APK_VERSION_TAG=$APK_VERSION_TAG" >> "$GITHUB_ENV"
          echo "APK_BASENAME=$APK_BASENAME" >> "$GITHUB_ENV"

          export TERMUX_APP_VERSION_NAME="${RELEASE_VERSION_NAME#v}"
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG"
          export TERMUX_PACKAGE_VARIANT="$PACKAGE_VARIANT"

          ./gradlew assembleDebug --no-daemon -Dorg.gradle.workers.max=2

          SOURCE_APK=$(ls "$APK_DIR_PATH"/*.apk 2>/dev/null | head -n 1 || true)
          if [ -z "$SOURCE_APK" ] || [ ! -f "$SOURCE_APK" ]; then
            echo "Error: Failed to find built debug APK in $APK_DIR_PATH" >&2
            exit 1
          fi

          cp "$SOURCE_APK" "$APK_DIR_PATH/$APK_BASENAME"
          (cd "$APK_DIR_PATH" && sha256sum "$APK_BASENAME" > "${APK_BASENAME%.apk}_sha256sums.txt")

      - name: Attach universal APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: konsole-os-debug-${{ matrix.package_variant }}
          path: |
            ${{ env.APK_DIR_PATH }}/${{ env.APK_BASENAME }}
            ${{ env.APK_DIR_PATH }}/*_sha256sums.txt
            ${{ env.APK_DIR_PATH }}/output-metadata.json
          retention-days: 14
